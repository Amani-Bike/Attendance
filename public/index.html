<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register member</title><link rel="stylesheet" href="/style.css"></head><body>
<nav><a class="on" href="/">Register</a><a href="/scan.html">Scanner</a><a href="/admin.html">Admin</a></nav>
<main>
<h1>Register a member</h1>
<div class="panel"><div id="formBox">
  <label for="name">Full name</label><input id="name" autocomplete="name">
  <label for="email">Email address</label><input id="email" type="email" autocomplete="email">
  <p><button id="go">Register and create ID card</button></p><div class="err" id="err" role="alert"></div>
</div></div>
<div class="panel" id="out" hidden>
  <div id="card"><img class="wm" id="wm" alt=""><div class="band"></div><div class="foot"></div>
    <div class="head"><img id="logo" src="/logo.jpg" alt=""><span id="org"></span></div>
    <div class="info"><div class="nm" id="cn"></div><div class="idn" id="ci"></div></div>
    <div class="qr"><img id="cq" alt="Member QR code"></div></div>
  <p><button id="print">Print ID card</button> <button class="ghost" id="again">Register another member</button></p>
  <p style="color:var(--muted)">In the print dialog, choose “Save as PDF” to download the card.</p>
</div></main>
<script>
const $=id=>document.getElementById(id);
$('go').onclick=async()=>{
  $('err').textContent='';
  const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('name').value,email:$('email').value})});
  const d=await r.json();
  if(!r.ok){$('err').textContent=d.error;return}
  $('org').textContent=d.org.name;$('logo').src=d.org.logo;$('wm').src=d.org.logo;
  $('cn').textContent=d.name;$('ci').textContent='ID '+String(d.id).padStart(5,'0');$('cq').src=d.qr;
  $('out').hidden=false;$('formBox').parentElement.hidden=true;
};
$('print').onclick=()=>window.print();
$('again').onclick=()=>{$('name').value=$('email').value='';$('out').hidden=true;$('formBox').parentElement.hidden=false};
</script></body></html>
